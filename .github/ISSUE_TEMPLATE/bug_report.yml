name: Bug report
description: Report a reproducible transport, YubiKey, notification, or setup problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include hostnames, usernames, SSH material, or hardware-token secrets.
        Report security vulnerabilities through the private security link instead.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Chrome over Waypipe
        - YubiKey forwarding
        - Notifications
        - Multiple areas
        - Installation or documentation
    validations:
      required: true

  - type: input
    id: local-system
    attributes:
      label: Display host
      description: Launcher host; Linux distribution, desktop/session type, notification daemon, and relevant package versions
      placeholder: Arch Linux, Wayland, waypipe 0.11.0
    validations:
      required: true

  - type: input
    id: remote-system
    attributes:
      label: Browser host
      description: Chrome host; Linux distribution, desktop or headless session, and relevant browser, Waypipe, USB/IP, or D-Bus binding versions
      placeholder: Arch Linux, google-chrome-stable, waypipe 0.11.0
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: remote-chrome revision
      description: Git commit on each host; distinguish source checkout, installed launcher, and an older active session
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Include the exact command and sanitized output
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include sanitized status/tmux output, notification backend and errors, SSH behavior, or reproduction details; doctor may send a visible probe

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed sensitive host, SSH, and hardware-token information.
          required: true
        - label: This is not a security vulnerability.
          required: true
