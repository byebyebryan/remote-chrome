<!doctype html><meta charset="utf-8"><title>RC TRANSPORT TEST</title><style>body{margin:0;font:18px sans-serif;background:#e9edf2;color:#17212c}#codes{position:fixed;left:0;top:0;height:96px;width:1200px;background:black;z-index:9}main{padding:110px 30px}p{line-height:1.6}canvas#scene{width:100%;height:550px}input{font-size:24px}</style><canvas id="codes" width="1200" height="96"></canvas><main><h1>Remote Chrome transport study</h1><input placeholder="Typing and text clarity"><canvas id="scene" width="1400" height="600"></canvas><div id="text"></div></main><script>
const name=new URLSearchParams(location.search).get('run')||'pilot';document.title='RC TRANSPORT TEST | '+name;
let seq=0,frame=0,running=false,start=0,last=0;const times=[];const code=document.querySelector('#codes').getContext('2d'),ctx=document.querySelector('#scene').getContext('2d');
document.querySelector('#text').innerHTML=Array.from({length:70},(_,i)=>`<p>${i}. Fine text, sharp borders, numbers 0123456789, and changing page content. A reliable remote browser must preserve input feedback during motion.</p>`).join('');
function crc8(byte){let v=byte^0xa5;for(let i=0;i<8;i++)v=((v<<1)^((v&128)?7:0))&255;return v}
function drawCode(){code.fillStyle='#000';code.fillRect(0,0,1200,96);code.fillStyle='#fff';code.fillRect(12,12,32,72);const crc=crc8(seq),keyWord=(seq|((seq^255)<<8)|(crc<<16)|((crc^255)<<24))>>>0,frameWord=(frame|((frame^65535)<<16))>>>0;for(let b=0;b<32;b++){code.fillStyle=(keyWord>>>b)&1?'#fff':'#000';code.fillRect(60+b*35,12,27,30);code.fillStyle=(frameWord>>>b)&1?'#fff':'#000';code.fillRect(60+b*35,54,27,30)}}

window.keyEvents=[];window.addEventListener('keydown',e=>{window.keyEvents.push({key:e.key,code:e.code,trusted:e.isTrusted,time:performance.now()});if(['x','f8'].includes(e.key.toLowerCase())){seq=(seq+1)%256;drawCode();e.preventDefault()}});
function tick(t){if(running){if(last)times.push(t-last);last=t;frame=(frame+1)%65536;const elapsed=t-start;const phase=Math.floor(elapsed/15000)%4;const y=(Math.sin(elapsed/1350)*.5+.5)*1400;scrollTo(0,phase===0&&!window.alwaysScroll?0:y);ctx.fillStyle='#dfe8f4';ctx.fillRect(0,0,1400,600);for(let i=0;i<100;i++){ctx.fillStyle=`hsl(${i*37%360} 65% 50%)`;ctx.fillRect((i*127+elapsed*(phase===2?.3:.08))%1450-50,i*83%600,100,60)}ctx.fillStyle='#132538';ctx.font='22px sans-serif';ctx.fillText('Mixed image and text motion '+Math.floor(elapsed),30,45);drawCode();if(elapsed>=60000)running=false}requestAnimationFrame(tick)}
window.startStudy=()=>{start=performance.now();last=0;times.length=0;running=true;return {viewport:[innerWidth,innerHeight],dpr:devicePixelRatio}};window.studyState=()=>({seq,frame,running,keyEvents:window.keyEvents,frames:times.length,duration:performance.now()-start,intervals:times});drawCode();requestAnimationFrame(tick);
</script>
